<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reestar</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: #ffffff;
    color: #111;
  }

  /* Header */
  header {
    background: #000;
    color: #fff;
    text-align: center;
    padding: 18px 10px 12px;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 28px;
    letter-spacing: 1px;
  }
  header nav {
    font-size: 13px;
    color: #ddd;
  }
  header nav span {
    margin: 0 6px;
    color: #888;
  }

  /* Card row */
  .cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0;
    padding: 24px 16px 32px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .card {
    border: 1px solid #ccc;
    width: 220px;
    text-align: center;
    background: #fff;
    margin: 0;
  }
  .card + .card { border-left: none; }
  .card img {
    width: 100%;
    height: 170px;
    object-fit: cover;
    display: block;
  }
  .card .info {
    padding: 10px 8px 14px;
  }
  .card h3 {
    font-size: 13px;
    margin: 6px 0 4px;
    font-weight: bold;
  }
  .card p {
    font-size: 11px;
    color: #333;
    margin: 0 0 10px;
    line-height: 1.3;
  }
  .card button {
    background: #000;
    color: #fff;
    border: none;
    padding: 6px 18px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .card button:hover { background: #222; }

  /* Contact section */
  .contact {
    background: #000;
    color: #fff;
    padding: 30px 16px 40px;
    text-align: center;
  }
  .contact h2 {
    margin: 0 0 20px;
    font-size: 22px;
    font-weight: bold;
  }
  .contact form {
    max-width: 340px;
    margin: 0 auto;
    text-align: left;
  }
  .contact .row {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
  }
  .contact .row label {
    width: 55px;
    font-size: 13px;
    flex-shrink: 0;
  }
  .contact .row input {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid #999;
    font-size: 13px;
    font-family: inherit;
  }
  .contact button[type="submit"] {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 10px;
    background: #ffe600;
    color: #000;
    border: none;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }
  .contact button[type="submit"]:hover { background: #f2d900; }

  @media (max-width: 700px) {
    .card { width: 45%; }
    .card + .card { border-left: 1px solid #ccc; }
  }
</style>
</head>
<body>

  <header>
    <h1>Reestar</h1>
    <nav>Home <span>|</span> Receipe <span>|</span> Contact</nav>
  </header>

  <section class="cards">
    <div class="card">
      <img src="https://loremflickr.com/300/220/pokebowl,food" alt="Tangy Tamarind Prawn Curry">
      <div class="info">
        <h3>Tangy Tamarind Prawn Curry</h3>
        <p>Something which is very delicious</p>
        <button>Order Now</button>
      </div>
    </div>
    <div class="card">
      <img src="https://loremflickr.com/300/220/noodles,food" alt="Tangy Tamarind Prawn Curry">
      <div class="info">
        <h3>Tangy Tamarind Prawn Curry</h3>
        <p>Something which is very delicious</p>
        <button>Order Now</button>
      </div>
    </div>
    <div class="card">
      <img src="https://loremflickr.com/300/220/salad,egg,food" alt="Tangy Tamarind Prawn Curry">
      <div class="info">
        <h3>Tangy Tamarind Prawn Curry</h3>
        <p>Something which is very delicious</p>
        <button>Order Now</button>
      </div>
    </div>
    <div class="card">
      <img src="https://loremflickr.com/300/220/pancakes,food" alt="Tangy Tamarind Prawn Curry">
      <div class="info">
        <h3>Tangy Tamarind Prawn Curry</h3>
        <p>Something which is very delicious</p>
        <button>Order Now</button>
      </div>
    </div>
  </section>

  <section class="contact">
    <h2>Contact Us</h2>
    <form onsubmit="return false;">
      <div class="row">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Name">
      </div>
      <div class="row">
        <label for="age">Age:</label>
        <input type="text" id="age" placeholder="Age">
      </div>
      <div class="row">
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Email">
      </div>
      <button type="submit">Send</button>
    </form>
  </section>

</body>
</html>
